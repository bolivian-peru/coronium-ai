<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coronium — chat demo</title>
  <style>
    :root {
      --fg: #0a0e16; --bg: #ffffff; --muted: #5a6378;
      --border: #d8dde6; --accent: #ff6b35; --bg-soft: #f4f6fa;
      --good: #1f8a3a; --bad: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6ebf2; --bg: #0d1218; --muted: #9aa3b3; --border: #1e2533; --bg-soft: #131922; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); margin: 0; line-height: 1.5; }
    main { max-width: 720px; height: 100%; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    .key-form { padding: 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; }
    .key-form input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: ui-monospace, monospace; background: var(--bg); color: var(--fg); }
    .key-form button { margin-top: 0.5rem; padding: 0.6rem 1rem; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
    #chat { display: none; flex: 1; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    #chat.active { display: flex; }
    #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .msg { display: flex; flex-direction: column; max-width: 85%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; }
    .bubble { padding: 0.5rem 0.85rem; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user .bubble { background: var(--accent); color: white; }
    .msg.assistant .bubble { background: var(--bg-soft); color: var(--fg); }
    .tool { font-size: 0.75rem; color: var(--muted); padding: 0.2rem 0.5rem; margin-top: 0.25rem; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 4px; font-family: ui-monospace, monospace; }
    .tool.ok { color: var(--good); }
    .tool.fail { color: var(--bad); }
    .input-bar { display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid var(--border); }
    .input-bar input { flex: 1; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; font-size: 0.95rem; }
    .input-bar button { padding: 0.6rem 1.25rem; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
    .alert { padding: 0.75rem; background: var(--bg-soft); border: 1px solid var(--bad); color: var(--bad); border-radius: 6px; margin: 0.5rem 0; }
    .footer { font-size: 0.8rem; color: var(--muted); text-align: center; padding: 0.5rem; border-top: 1px solid var(--border); }
    .footer a { color: var(--accent); text-decoration: none; }
    .typing { color: var(--muted); font-style: italic; padding: 0.25rem 0.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Coronium — chat demo</h1>

    <section class="key-form" id="key-form">
      <p style="margin-top: 0">Paste your <code>sk_live_…</code> API key to start. <a href="https://coronium.ai/free" target="_blank" rel="noopener">Get a free voucher</a> first if you don't have a key yet.</p>
      <input id="apikey" placeholder="sk_live_..." autofocus />
      <button id="start">Start chat</button>
    </section>

    <section id="chat">
      <div id="messages"></div>
      <form class="input-bar" id="input-bar">
        <input id="draft" placeholder="Buy me a US 5G proxy. Or: what's my balance?" autofocus />
        <button type="submit" id="send">Send</button>
      </form>
      <div class="footer">
        Powered by <a href="https://coronium.ai" target="_blank" rel="noopener">Coronium</a>
      </div>
    </section>
  </main>

  <script type="module">
    const API = window.CORONIUM_API_BASE ?? "https://api.coronium.ai/v1";

    const $ = (id) => document.getElementById(id);
    const messages = [];
    let apiKey = null;
    let streaming = false;
    let abortCtl = null;

    // Bootstrap from URL hash for testing convenience: #key=sk_live_...
    const fragKey = new URL(window.location.href).hash.match(/key=([^&]+)/)?.[1];
    if (fragKey) $("apikey").value = decodeURIComponent(fragKey);

    $("start").addEventListener("click", () => {
      const k = $("apikey").value.trim();
      if (!k.startsWith("sk_live_")) { alert("Doesn't look like a Coronium API key. Should start with sk_live_…"); return; }
      apiKey = k;
      $("key-form").style.display = "none";
      $("chat").classList.add("active");
      // Greet
      messages.push({ role: "assistant", content: "Hi! I can buy proxies, rotate IPs, check your balance, or list tariffs. What would you like to do?", toolCalls: [] });
      render();
    });

    $("input-bar").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (streaming) return;
      const content = $("draft").value.trim();
      if (!content) return;
      $("draft").value = "";
      messages.push({ role: "user", content });
      render();
      await stream();
    });

    async function stream() {
      streaming = true;
      $("send").disabled = true;
      const assistant = { role: "assistant", content: "", toolCalls: [] };
      messages.push(assistant);

      // Show typing indicator until first delta arrives.
      const typingEl = document.createElement("div");
      typingEl.className = "typing";
      typingEl.textContent = "Thinking…";
      $("messages").appendChild(typingEl);
      $("messages").scrollTop = $("messages").scrollHeight;

      abortCtl = new AbortController();
      try {
        const res = await fetch(`${API}/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "text/event-stream",
            Authorization: `Bearer ${apiKey}`,
          },
          body: JSON.stringify({ messages: messages.slice(0, -1) }),
          signal: abortCtl.signal,
        });

        if (!res.ok || !res.body) {
          let body;
          try { body = await res.json(); } catch {}
          throw new Error(`${body?.code ?? `HTTP_${res.status}`}: ${body?.message ?? res.statusText}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        let firstDelta = true;

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });

          let idx;
          while ((idx = buf.indexOf("\n\n")) !== -1) {
            const event = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            for (const line of event.split("\n")) {
              if (!line.startsWith("data:")) continue;
              const evt = JSON.parse(line.slice(5).trim());
              if (evt.type === "text" && firstDelta) {
                typingEl.remove();
                firstDelta = false;
              }
              handleEvent(evt, assistant);
            }
            render();
          }
        }
      } catch (err) {
        typingEl.remove();
        if (err.name !== "AbortError") {
          assistant.content = `[error] ${err.message}`;
          render();
        }
      } finally {
        streaming = false;
        $("send").disabled = false;
        abortCtl = null;
      }
    }

    function handleEvent(evt, assistant) {
      switch (evt.type) {
        case "text":
          assistant.content += evt.delta;
          break;
        case "tool_use":
          assistant.toolCalls.push({ id: evt.id, tool: evt.tool, args: evt.args });
          break;
        case "tool_result": {
          const tc = assistant.toolCalls.find(t => t.id === evt.id);
          if (tc) {
            tc.ok = evt.ok;
            if (!evt.ok) tc.error = { code: evt.code, message: evt.message };
          }
          break;
        }
        case "error":
          assistant.content += `\n\n[error ${evt.code}] ${evt.message}`;
          break;
      }
    }

    function render() {
      $("messages").innerHTML = messages.map(m => {
        const tools = (m.toolCalls ?? []).map(t => {
          const status = t.ok === undefined ? "⏳" : t.ok ? "✓" : "✗";
          const cls = t.ok === undefined ? "" : t.ok ? "ok" : "fail";
          const err = t.error ? ` — ${escape(t.error.code)}` : "";
          return `<div class="tool ${cls}">${status} ${escape(t.tool)}${err}</div>`;
        }).join("");
        return `<div class="msg ${m.role}"><div class="bubble">${escape(m.content)}</div>${tools}</div>`;
      }).join("");
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function escape(s) {
      return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }
  </script>
</body>
</html>
